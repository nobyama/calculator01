<!DOCTYPE html>
<html lang="ja">

<head>
<title>電卓アプリ</title>
<meta charset="utf-8">
<meta name="viewport" content="user-scalable=yes, width=300px, maximum-scale=3.0" />
<style>
	#画面 {
		border-collapse: collapse;
		margin-bottom: 8px; 
		height: 50px;
		border-radius: 10px;
		background-color: black;
		box-shadow: rgb(128, 128, 128) 4px 4px;
	}
	#Mマーク表示画面 {
		width: 15px;
		vertical-align: bottom;
		padding-left: 5px;
		font-size: 15px;
		color: lime;
	}
	#M数値表示画面 {
		width: 15px;
		text-align: left;
		vertical-align: top;
		padding-left: 5px;
		font-size: 15px;
		color: lime;
		table-layout: fixed;
	}
	#メイン画面 {
		width: 260px;
		padding-right: 5px;
		text-align: right;
		font-size: 40px;
		color: white;
		table-layout: fixed;
	}
	#四則演算マーク表示画面 {
		width: 15px;
		padding-top: 10px;
		vertical-align: top;
		font-size: 15px;
		color: white;
	}
	.計算ボタン, .Mボタン, .数字ボタン {
		width: 70px;
		height: 70px;
		border: 1px solid blue;
		border-radius: 15px;
		text-align: center;
		color: white;
		box-shadow: rgb(128, 128, 128) 5px 5px;
	}
	.計算ボタン {
		font-size: 36px;
		background-color: navy;
	}
	.Mボタン {
		font-size: 30px;
		background-color: #004400;
	}
	.数字ボタン {
		font-size: 36px;
		background-color: gray;
	}
	#開発者名 {
		font-family: "Impact", Fantasy;
	}

</style>
<script>
let 表示数値 = "";
let 一時保存数値 = "";
let M数値 = "";
let 四則演算の種類 = "";

function ACクリック(key) {
	ボタン押下後色変更(key);
	document.getElementById("メイン画面").textContent = "0";
	document.getElementById("Mマーク表示画面").textContent = " ";
	document.getElementById("四則演算マーク表示画面").textContent = " ";
	document.getElementById("M数値表示画面").textContent = "";
	表示数値 = "";
	一時保存数値 = ""; 
	M数値 = "";
	四則演算の種類 = "";
}

function RMクリック(key) {
	ボタン押下後色変更(key);
	document.getElementById("メイン画面").textContent = M数値;
	表示数値= M数値;
}

function Mplusクリック(key) {
	ボタン押下後色変更(key);
	M数値 = M数値 * 1 + 表示数値 * 1;
	M数値.toString();
	一時保存数値 = ""; 
	表示数値 = "0";
	document.getElementById("Mマーク表示画面").textContent = "M";
	document.getElementById("M数値表示画面").textContent = M数値;
}

function 四則演算クリック(key) {
	ボタン押下後色変更(key);
	if (一時保存数値 != "") {						// 四則演算ボタンを押したときに、ひとまずここまでの計算結果を表示
		計算クリック(key);
	}
	一時保存数値 = 表示数値; 
	表示数値 = "0";
	四則演算の種類 = key;
	document.getElementById("四則演算マーク表示画面").textContent = 四則演算の種類;
}

function 数字クリック(key) {
	ボタン押下後色変更(key);
	if (四則演算の種類 == "＝") {				// 計算ボタン(=)を押した直後であれば、数値を初期化
		表示数値 = "";
		一時保存数値 = ""; 
		四則演算の種類 = "";
	}
	if (key == ".") {							// (1)小数ボタンを押した際の条件分岐
		if (表示数値.indexOf( "." ) == -1) {		// 	表示数値の中に小数点が無い場合、小数点を追加
			表示数値 = 表示数値 + key; 	
		}								// 	表示数値の中に小数点がある場合、何もしない
	} else {
		if (表示数値 == "0") {				// (2)数字ボタンを押した際の条件分岐
			表示数値 = "";					// 	表示数値が0の場合のみ、表示数値を一時的に空白とする
		}
		表示数値 = 表示数値 + key;	 		// 	表示数値に、数字ボタンの値を追加
	 }
	document.getElementById("メイン画面").textContent = 表示数値;
}

function 計算クリック(key) {
	ボタン押下後色変更(key);
	Number(表示数値);						// 演算前に、表示数値と一時保存数値を文字列→数値とする
	Number(一時保存数値);
	if (四則演算の種類 == "＋") {				// 足し算
		表示数値 = 一時保存数値 * 1 + 表示数値 * 1;
	} else if (四則演算の種類 == "－") {			// 引き算
		表示数値 = 一時保存数値 - 表示数値;
	} else if (四則演算の種類 == "×") {			// 掛け算
		表示数値 = 一時保存数値 * 表示数値;
	} else if (四則演算の種類 == "÷") {			// 割り算
		表示数値 = 一時保存数値 / 表示数値;
	}
	表示数値 = Math.round(表示数値 * 10000000) / 10000000		// 演算後、小数点8桁で数値を丸める
	一時保存数値 = 0;
	四則演算の種類 = "＝";					// 計算ボタンを押したことを記録（直後に数字ボタンを押した場合の対応用）
	表示数値.toString();						// 演算後は、表示数値と一時保存数値を数値→文字列とする
	一時保存数値.toString();
	document.getElementById("メイン画面").textContent = 表示数値;
	document.getElementById("四則演算マーク表示画面").textContent = " ";
}

function BSクリック(key) {
	ボタン押下後色変更(key);
	表示数値 = 表示数値.slice(0, 表示数値.length - 1);
	document.getElementById("メイン画面").textContent = 表示数値;
}

function ボタン押下後色変更(key) {
	let ボタン色 = document.getElementById(key).style.backgroundColor;
	setTimeout(function() {document.getElementById(key).style.backgroundColor = 'silver'}, 30);
	setTimeout(function() {document.getElementById(key).style.backgroundColor = ボタン色}, 100);
}

</script>
</head>

<body>

<table id="画面">
<tr>
	<td id="Mマーク表示画面"></td>
	<td id="メイン画面" rowspan="2">0</td>
	<td id="四則演算マーク表示画面" rowspan="2"></td>
</tr>
<tr>
	<td id="M数値表示画面"></td>
</tr>
</table>

<table id="ボタン">
<tr>
	<td class="計算ボタン" id="AC" onclick="ACクリック('AC')">AC</td>
	<td class="Mボタン" id="RM" onclick="RMクリック('RM')">RM</td>
	<td class="Mボタン" id="Mplus" onclick="Mplusクリック('Mplus')">M＋</td>
	<td class="計算ボタン" id="÷" onclick="四則演算クリック('÷')">÷</td>
</tr>
<tr>
	<td class="数字ボタン" id="7" onclick="数字クリック(7)">7</td>
	<td class="数字ボタン" id="8" onclick="数字クリック(8)">8</td>
	<td class="数字ボタン" id="9" onclick="数字クリック(9)">9</td>
	<td class="計算ボタン" id="×" onclick="四則演算クリック('×')">×</td>
</tr>
<tr>
	<td class="数字ボタン" id="4" onclick="数字クリック(4)">4</td>
	<td class="数字ボタン" id="5" onclick="数字クリック(5)">5</td>
	<td class="数字ボタン" id="6" onclick="数字クリック(6)">6</td>
	<td class="計算ボタン" id="－" onclick="四則演算クリック('－')">－</td>
</tr>
<tr>
	<td class="数字ボタン" id="1" onclick="数字クリック(1)">1</td>
	<td class="数字ボタン" id="2" onclick="数字クリック(2)">2</td>
	<td class="数字ボタン" id="3" onclick="数字クリック(3)">3</td>
	<td class="計算ボタン" id="＋" onclick="四則演算クリック('＋')">＋</td>
</tr>
<tr>
	<td class="数字ボタン" id="0" onclick="数字クリック(0)">0</td>
	<td class="数字ボタン" id="." onclick="数字クリック('.')">.</td>
	<td class="数字ボタン" id="BS" onclick="BSクリック('BS')">BS</td>
	<td class="計算ボタン" id="＝" onclick="計算クリック('＝')">＝</td>
</tr>
</table>
</br>
</br>
<img src="byNobushikoSystems.png" alt="by Nobushiko Systems">
</body>
</html>
